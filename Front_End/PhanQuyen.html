<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Quyền Người Dùng</title>
    <link rel="stylesheet" href="resources/admin/css/admin.css">
    <link rel="stylesheet" href="resources/admin/css/computer/admin.css" media="screen and (min-width: 769px)">
    <link rel="stylesheet" href="resources/admin/css/mobile/admin.css" media="screen and (max-width: 768px)">
    <link rel="stylesheet" href="resources/admin/css/phanquyen.css">
    <link rel="stylesheet" href="resources/admin/css/computer/phanquyen.css" media="screen and (min-width: 769px)">
    <link rel="stylesheet" href="resources/admin/css/mobile/phanquyen.css" media="screen and (max-width: 768px)">
</head>
<body>
    <!-- Admin Toolbar -->
    <div class="toolbar">
        <div class="menu-button" onclick="toggleSidebar()">
            <img src="resources/admin/icons/menu_admin.png" alt="Menu Icon" class="menu">
        </div>
        <div class="toolbar-icons">
            <div class="icon" onclick="toggleFullscreen()">
                <img src="resources/admin/icons/fullscreen.png" alt="Fullscreen Icon" class="menu-icon">
            </div>
            <div class="icon" onclick="toggleDarkMode()">
                <img src="resources/admin/icons/dark.png" alt="Dark Icon" class="menu-icon">
            </div>
            <div class="icon">
                <img src="resources/admin/icons/option.png" alt="Settings Icon" class="menu-icon">
            </div>
            <div class="badge">
                <img src="resources/images/brand/brandlogo.png" alt="Logo">
            </div>
        </div>
    </div>

    <!-- Admin Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>DU LỊCH - KHÁM PHÁ</h2>
            <span class="close-btn" onclick="toggleSidebar()">×</span>
        </div>
        <ul>
            <li><a href="admin.html">Trang chủ</a></li>
            <li><a href="add-tour.html">Thêm Tour</a></li>
            <li><a href="#">Danh sách hóa đơn</a></li>
            <li><a href="PhanQuyen.html">Phân Quyền</a></li>
            <li><a href="#">Đánh giá</a></li>
            <li><a href="#">Quản lý Tour</a></li>
            <li><a href="#">Thống kê</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="container" style="background-color: white;">
        <h2>Danh Sách Người Dùng</h2>
        <div class="user-list-container">
            <table>
                <thead>
                    <tr>
                        <th>Ảnh Đại Diện</th>
                        <th>Email</th>
                        <th>Tên Đăng Nhập</th>
                        <th>Quyền</th>
                        <th>Số điện thoại</th>
                        <th>Địa chỉ</th>
                        <th>Giới Tính</th>
                        <th>Ngày Tạo</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody id="userList">
                    <!-- User data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editUserModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Chỉnh Sửa Thông Tin Người Dùng</h3>
                <span class="modal-close" onclick="closeEditModal()">&times;</span>
            </div>
            <form id="editUserForm" onsubmit="saveUserChanges(event)">
                <div class="modal-body">
                    <div class="form-group">
                        <label>Email (Không thể sửa):</label>
                        <input type="email" id="editEmail" readonly class="form-control-readonly">
                    </div>
                    <div class="form-group">
                        <label>Tên Đăng Nhập:</label>
                        <input type="text" id="editTendangnhap" required class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Mật Khẩu Mới (Để trống nếu không đổi):</label>
                        <input type="password" id="editMatkhau" placeholder="Nhập mật khẩu mới..." class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Số Điện Thoại:</label>
                        <input type="text" id="editSodienthoai" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Địa Chỉ:</label>
                        <input type="text" id="editDiachi" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Giới Tính:</label>
                        <select id="editGioitinh" class="form-control">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Phân Quyền:</label>
                        <select id="editPhanquyen" class="form-control">
                            <option value="Admin">Admin</option>
                            <option value="User">User</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background: #ffffff;
            width: 90%; max-width: 500px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            animation: modalFadeIn 0.3s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-header {
            padding: 16px 20px; background: #4a90e2; color: #fff;
            display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .modal-close { font-size: 1.5rem; cursor: pointer; color: #fff; }
        .modal-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 8px 12px; border: 1,5px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .form-control-readonly { width: 100%; padding: 8px 12px; border: 1px solid #ddd; background: #eee; border-radius: 6px; box-sizing: border-box; }
        .modal-footer { padding: 12px 20px; background: #f8f9fa; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; }
        .btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
        .btn-primary { background: #4a90e2; color: #fff; }
        .btn-secondary { background: #6c757d; color: #fff; }
        .btn-warning { background: #f0ad4e; color: #fff; }
    </style>

    <script src="resources/js/scripts.js"></script>
    <script src="resources/admin/js/admin.js"></script>
    <script src="resources/admin/js/phanquyen.js"></script>
    <script src="resources/admin/js/ChanUser.js"></script>
</body>
</html>
