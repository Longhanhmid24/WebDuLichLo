<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Thông tin meta và tiêu đề -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Du Lịch</title>
    <!-- CSS Tách Biệt -->
    <link rel="stylesheet" href="resources/css/styles.css">
    <link rel="stylesheet" href="resources/css/computer/styles.css" media="screen and (min-width: 769px)">
    <link rel="stylesheet" href="resources/css/mobile/styles.css" media="screen and (max-width: 768px)">
    <link rel="stylesheet" href="resources/css/theme.css">
    <!-- Thư viện Flickity CSS -->
    <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
    <!-- Thư viện Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="resources/css/bill.css">
</head>
<body>
    <!-- Header dùng chung (layout.js tự chèn) -->
    <div id="site-header"></div>

    <main class="site-main">

    <!-- Main Content -->
    <div class="invoice" id="invoice">
        <div class="invoice-header">
            <h2>Hóa đơn tour</h2>
        </div>
    
        <div class="invoice-body">
            <h3>Thông tin tour:</h3>
            <table>
                <tr>
                    <th>Tên tour</th>
                    <td id="tour-name"></td>
                </tr>
                <tr>
                    <th>Mô tả</th>
                    <td id="tour-description"></td>
                </tr>
                <tr>
                    <th>Ngày khởi hành</th>
                    <td id="tour-start-date"></td>
                </tr>
                <tr>
                    <th>Ngày kết thúc</th>
                    <td id="tour-end-date"></td>
                </tr>
                <tr>
                    <th>Số người</th>
                    <td id="total-people"></td>
                </tr>
                <tr>
                    <th>Tổng tiền</th>
                    <td id="total-amount"></td>
                </tr>
            </table>
    
            <div class="total">
                <p>Tổng tiền: <span id="totalPrice"></span> VND</p>
            </div>
        </div>

        <div class="invoice-footer" style="margin-top: 20px; text-align: center;">
            <button id="view-orders-btn">Xem danh sách đơn đã đặt</button>
        </div>
    </div>
    </main>
    <!-- Footer dùng chung (layout.js tự chèn) -->
    <div id="site-footer"></div>

    <script src="resources/js/scripts.js"></script>
    <script src="resources/js/layout.js"></script>
    <script src="resources/js/bill.js"></script>
    <script src="html/auth/oauthen/login.js"></script>
</body>
</html>
