<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập</title>
    <!-- CSS Tách Biệt -->
    <link rel="stylesheet" href="../../resources/css/styles.css">
    <link rel="stylesheet" href="../../resources/css/computer/styles.css" media="screen and (min-width: 769px)">
    <link rel="stylesheet" href="../../resources/css/mobile/styles.css" media="screen and (max-width: 768px)">
    <link rel="stylesheet" href="../../resources/css/theme.css">
    <!-- Thư viện Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="auth-page">
    <!-- Header dùng chung (layout.js tự chèn) -->
    <div id="site-header"></div>


    <!-- Phần đăng nhập -->
    <section class="py-5">
        <div class="container auth-card">
            <h2 class="text-center">Đăng Nhập</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="Emaildangki">Email:</label>
                    <input type="email" class="form-control" id="Emaildangki" placeholder="Nhập email">
                </div>
                <div class="form-group">
                    <label for="Matkhau">Mật Khẩu:</label>
                    <input type="password" class="form-control" id="Matkhau" placeholder="Nhập mật khẩu">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Đăng Nhập</button>
                <p class="text-center mt-3"><a href="forgot-password.html">Quên mật khẩu?</a></p>
                <p class="text-center mt-3">Hoặc đăng nhập bằng</p>
                <div class="d-flex justify-content-center">
                    <a href="https://webdulichlo.onrender.com/api/TaiKhoan/google-login" id="google-login-btn" class="btn btn-link mx-2">
                        <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google" width="30">
                    </a>
                    <a href="/api/auth/facebook" class="btn btn-link mx-2">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook" width="30">
                    </a>
                </div>
                <p class="text-center mt-3">Chưa có tài khoản? <a href="register.html">Đăng Ký</a></p>
            </form>
        </div>
    </section>
    <script src="../../resources/js/layout.js"></script>
    <script src="../../resources/js/config.js"></script>
    <script src="../../resources/js/scripts.js"></script>
    <script src="oauthen/login.js"></script>
    <!-- Footer dùng chung (layout.js tự chèn) -->
    <div id="site-footer"></div>
</body>
</html>
