<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên Mật Khẩu</title>
    <!-- CSS Tách Biệt -->
    <link rel="stylesheet" href="../../resources/css/styles.css">
    <link rel="stylesheet" href="../../resources/css/computer/styles.css" media="screen and (min-width: 769px)">
    <link rel="stylesheet" href="../../resources/css/mobile/styles.css" media="screen and (max-width: 768px)">
    <link rel="stylesheet" href="../../resources/css/theme.css">
    <!-- Thư viện Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="auth-page">
    <!-- Header dùng chung (layout.js tự chèn) -->
    <div id="site-header"></div>


    <!-- Phần quên mật khẩu -->
    <section class="py-5">
        <div class="container auth-card">
            <h2 class="text-center">Quên Mật Khẩu</h2>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Nhập email để khôi phục mật khẩu">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Gửi Yêu Cầu</button>
                <p class="text-center mt-3"><a href="login.html">Quay lại Đăng Nhập</a></p>
            </form>
        </div>
    </section>
    <!-- Footer dùng chung (layout.js tự chèn) -->
    <div id="site-footer"></div>
    <script src="oauthen/forgot-password.js"></script>
    <script src="../../resources/js/layout.js"></script>
    <script src="../../resources/js/scripts.js"></script>
</body>
</html>
