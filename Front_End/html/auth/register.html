<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký</title>
    <!-- CSS Tách Biệt -->
    <link rel="stylesheet" href="../../resources/css/styles.css">
    <link rel="stylesheet" href="../../resources/css/computer/styles.css" media="screen and (min-width: 769px)">
    <link rel="stylesheet" href="../../resources/css/mobile/styles.css" media="screen and (max-width: 768px)">
    <link rel="stylesheet" href="../../resources/css/theme.css">
    <!-- Thư viện Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="auth-page">
    <!-- Header dùng chung (layout.js tự chèn) -->
    <div id="site-header"></div>


    <!-- Phần đăng ký -->
    <section class="py-5">
        <div class="container auth-card">
            <h2 class="text-center">Đăng Ký</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="Emaildangki">Email:</label>
                    <input type="email" class="form-control" id="Emaildangki" name="Emaildangki" placeholder="Nhập email" required>
                </div>
                <div class="form-group">
                    <label for="Tendangnhap">Tên đăng nhập:</label>
                    <input type="text" class="form-control" id="Tendangnhap" name="Tendangnhap" placeholder="Nhập tên">
                </div>
                <div class="form-group">
                    <label for="Matkhau">Mật Khẩu:</label>
                    <input type="password" class="form-control" id="Matkhau" name="Matkhau" placeholder="Nhập mật khẩu">
                </div>
                <div class="form-group">
                    <label for="MatkhauXacNhan">Xác Nhận Mật Khẩu:</label>
                    <input type="password" class="form-control" id="MatkhauXacNhan" name="MatkhauXacNhan" placeholder="Xác nhận mật khẩu" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Đăng Ký</button>
                <p class="text-center mt-3">Đã có tài khoản? <a href="login.html">Đăng Nhập</a></p>
            </form>
        </div>
    </section>
    <!-- Footer dùng chung (layout.js tự chèn) -->
    <div id="site-footer"></div>
    <script src="../../resources/js/layout.js"></script>
    <script src="../../resources/js/scripts.js"></script>
    <script src="oauthen/oauthen2.js"></script>
</body>
</html>
