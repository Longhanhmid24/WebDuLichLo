<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Thông tin meta và tiêu đề -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Du Lịch</title>
    <!-- CSS Tách Biệt -->
    <link rel="stylesheet" href="resources/css/styles.css">
    <link rel="stylesheet" href="resources/css/computer/styles.css" media="screen and (min-width: 769px)">
    <link rel="stylesheet" href="resources/css/mobile/styles.css" media="screen and (max-width: 768px)">
    <link rel="stylesheet" href="resources/css/theme.css">
    <!-- Thư viện Flickity CSS -->
    <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
    <!-- Thư viện Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="resources/css/Add_ProFile.css">
</head>
<body>
    <!-- Header dùng chung (layout.js tự chèn) -->
    <div id="site-header"></div>

    <main class="site-main">

    <!-- Main Content -->
    <div class="profile-container">
        <div class="avatar-wrapper">
            <!-- Hiển thị ảnh đại diện -->
            <img id="avatar" src="anhmacdinh.png" alt="Ảnh đại diện người dùng" width="150">
            
            <!-- Input để người dùng chọn ảnh -->
            <input type="file" id="avatarInput" accept="image/*" hidden>
            
            <!-- Nút để người dùng chọn ảnh -->
            <button onclick="document.getElementById('avatarInput').click()">🖼️ Đổi ảnh</button>
            
            <!-- Nút để lưu ảnh đã thay đổi -->
            <button id="save-avatar" onclick="saveAvatar()" hidden>Lưu ảnh</button>
        </div>
        <h1>Hồ sơ cá nhân</h1>
        <div class="profile-info">
            <p><strong>Email:</strong> <span id="email"></span></p>

            <p>
                <strong>Tên đăng nhập:</strong>
                <input type="text" id="tendangnhap" readonly>
                <button onclick="editField('tendangnhap')">✏️</button>
                <button onclick="saveField('tendangnhap')" hidden>Lưu</button>
            </p>

            <p>
                <strong>Số điện thoại:</strong>
                <input type="text" id="sodienthoai" readonly>
                <button onclick="editField('sodienthoai')">✏️</button>
                <button onclick="saveField('sodienthoai')" hidden>Lưu</button>
            </p>

            <p>
                <strong>Địa chỉ:</strong>
                <input type="text" id="diachi" readonly>
                <button onclick="editField('diachi')">✏️</button>
                <button onclick="saveField('diachi')" hidden>Lưu</button>
            </p>

            <p>
                <strong>Giới tính:</strong>
                <label>
                    <input type="radio" name="gioitinh" value="Nam" id="gioitinhNam"> Nam
                </label>
                <label>
                    <input type="radio" name="gioitinh" value="Nữ" id="gioitinhNu"> Nữ
                </label>
                <label>
                    <input type="radio" name="gioitinh" value="Khác" id="gioitinhKhac"> Khác
                </label>
                <button onclick="editGender()">✏️</button>
                <button id="save-gender-btn" onclick="saveGender()" hidden>Lưu</button>
            </p>
            <p><strong>Phân quyền:</strong> <span id="phanquyen"></span></p>
            <p><strong>Ngày tạo:</strong> <span id="ngaytao"></span></p>
        </div>
    </div>
    </main>
    <!-- Footer dùng chung (layout.js tự chèn) -->
    <div id="site-footer"></div>

    <script src="resources/js/Add_ProFile.js"></script>
    <script src="resources/js/layout.js"></script>
    <script src="resources/js/scripts.js"></script>
    <script src="html/auth/oauthen/login.js"></script>
</body>
</html>
