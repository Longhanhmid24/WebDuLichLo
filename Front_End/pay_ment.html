<!DOCTYPE html>
<html lang="vi">
<head>
    <!-- Thông tin meta và tiêu đề -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Du Lịch</title>
    <!-- CSS Tách Biệt -->
    <link rel="stylesheet" href="resources/css/styles.css">
    <link rel="stylesheet" href="resources/css/computer/styles.css" media="screen and (min-width: 769px)">
    <link rel="stylesheet" href="resources/css/mobile/styles.css" media="screen and (max-width: 768px)">
    <link rel="stylesheet" href="resources/css/theme.css">
    <!-- Thư viện Flickity CSS -->
    <link rel="stylesheet" href="https://unpkg.com/flickity@2/dist/flickity.min.css">
    <!-- Thư viện Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="resources/css/pay_ment.css">
    <link rel="stylesheet" href="resources/css/layout_pay.css">
</head>
<body>
    <!-- Header dùng chung (layout.js tự chèn) -->
    <div id="site-header"></div>

    <main class="site-main">

    <!-- Main Content -->
    <div class="content">
        <h1 id="tour-name"></h1>
        <img id="tour-image" src="/images/default.jpg" />
        <p id="tour-description"></p>
        <p>Số khách tối đa: <span id="tour-seats"></span></p>
        <p>Ngày khởi hành: <span id="tour-start-date"></span></p>
        <p>Ngày Kết Thúc: <span id="tour-end-date"></span></p>
        <p>Hãy chọn số lượng vé phù hợp và hoàn tất đặt tour để có trải nghiệm tuyệt vời.</p>
    </div>

    <div class="booking-container">
        <h2 style="color: #333;">Lịch Trình và Giá Tour</h2>
        <p>Chọn Lịch Trình và Xem Giá:</p>

        <div class="ticket-type">
            <div>
                <strong>Người lớn</strong> <br>
            </div>
            <div class="price">x <span id="tour-price-adult"></span></div>
            <div class="counter">
                <button onclick="updateTicket('adult', -1)">-</button>
                <input type="text" id="adult" value="2" readonly>
                <button onclick="updateTicket('adult', 1)">+</button>
            </div>
        </div>

        <div class="ticket-type">
            <div>
                <strong>Trẻ em</strong> <br>
            </div>
            <div class="price">x <span id="tour-price-child"></span></div>
            <div class="counter">
                <button onclick="updateTicket('child', -1)">-</button>
                <input type="text" id="child" value="0" readonly>
                <button onclick="updateTicket('child', 1)">+</button>
            </div>
        </div>

        <div class="ticket-type">
            <div>
                <strong>Trẻ nhỏ</strong> <br> 
            </div>
            <div class="price">x <span id="tour-price-baby"></span></div>
            <div class="counter">
                <button onclick="updateTicket('baby', -1)">-</button>
                <input type="text" id="baby" value="0" readonly>
                <button onclick="updateTicket('baby', 1)">+</button>
            </div>
        </div>

        <p class="total">Tổng Giá Tour: <span id="totalPrice"></span> đ</p>
        <div class="order-button" onclick="processPayment()">Yêu cầu đặt</div>
    </div>
    </main>
    <!-- Footer dùng chung (layout.js tự chèn) -->
    <div id="site-footer"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flickity/2.2.2/flickity.pkgd.min.js"></script>
    <script src="resources/js/pay_ment.js"></script>
    <script src="resources/js/layout.js"></script>
    <script src="resources/js/scripts.js"></script>
    <script src="html/auth/oauthen/login.js"></script>
</body>
</html>
